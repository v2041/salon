services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salon}
      POSTGRES_USER: ${POSTGRES_USER:-salon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SalonDbContext: Host=db;Port=5432;Database=${POSTGRES_DB:-salon};Username=${POSTGRES_USER:-salon};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-salon}
      Jwt__Audience: ${JWT_AUDIENCE:-salon-client}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: final
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SalonDbContext: Host=db;Port=5432;Database=${POSTGRES_DB:-salon};Username=${POSTGRES_USER:-salon};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-salon}
      Jwt__Audience: ${JWT_AUDIENCE:-salon-client}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Cors__AllowedOrigins__0: ${PUBLIC_URL:-http://localhost}
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/salon
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
